name: 🐛 Bug report
description: Something in this repository isn't working as expected.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! For issues with the Quiverstone
        platform itself, please use [support.quiverstone.io](https://support.quiverstone.io/) instead.
        **Never paste AWS account IDs, ARNs with sensitive names, credentials, or External IDs.**
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Deploy template '...'
        2. Run '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.2.3 or a commit SHA
  - type: dropdown
    id: partition
    attributes:
      label: AWS partition
      options:
        - aws (commercial)
        - aws-us-gov (GovCloud)
        - Other / not applicable
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Redact anything sensitive. This is rendered as code automatically.
      render: shell
