<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200" role="img" aria-label="GitHub Stats">
  <title>GitHub Stats</title>
  <style>
    .title { font: 600 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #FF9900; }
    .label { font: 400 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #8b949e; }
    .value { font: 700 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif; fill: #c9d1d9; }
    .row { opacity: 0; animation: fade .4s ease-out forwards; }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .row { opacity: 1; animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="419" height="199" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="24" y="34" class="title">GitHub Stats</text>
  <text x="24" y="70" class="label">Refreshing — stats appear after the first workflow run.</text>
</svg>
